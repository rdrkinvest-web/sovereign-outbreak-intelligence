[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-outbreak-intelligence"
version = "0.1.1"
description = "Ministry-of-Health agents investigate a synthetic cross-border outbreak together; queries move, sovereign data does not."
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "flwr>=1.39.0,<2.0",
    "openai>=2.16.0,<3.0.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.flwr.app]
publisher = "pbggo"
display-name = "Sovereign Outbreak Intelligence"
fab-format-version = 1
flwr-version-target = "1.39.0"
# Code only. National datasets never enter the bundle; each node mounts its own.
fab-include = ["agent/**/*.py", "LICENSE"]

[tool.flwr.app.components]
agentapp = "agent.agent_app:app"

[tool.flwr.app.config]
model = "openai/gpt-5.6-sol"  # one model for every agent (Spec §11); "flwrlabs/endeavor-1.0" also works but its preview was flaky
node-agents = true             # false: nodes answer deterministically (fallback Level C)
ai-follow-up = true            # false: the coordinator's fixed rule picks round 3
llm-brief = true
ui-events = true              # structured progress events for the live console (ui/)

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# SuperNodes install the app with `uv sync`; keep dev tools (pytest) off them.
# Locally: uv run --group dev pytest
default-groups = []
